<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>表情星球 · 后台</title>
<style>
  :root { --ink:#1A1505; --ink-2:#5a5340; --accent:#F0531E; --yellow:#FFD23D; --line:#ece6d6; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,system-ui,"PingFang SC",sans-serif; color:var(--ink); background:#fbf7ec; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--ink-2); font-size:12px; margin-bottom:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:18px; }
  .stat { background:#fff; border:2px solid var(--ink); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--ink-2); font-size:12px; }
  .stat .accent { color:var(--accent); }
  section { background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  h2 { font-size:14px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--ink-2); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:600; }
  .done { background:#e6f7ea; color:#1a8a3d; } .error { background:#fde8e8; color:#c0392b; } .running { background:#fff3d6; color:#a8780a; }
  .err-detail { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:#c0392b; word-break:break-all; }
  .muted { color:var(--ink-3,#9a917a); }
  .gate { max-width:320px; margin:60px auto; text-align:center; }
  .gate input { width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; font-size:14px; margin:10px 0; }
  .gate button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 20px; font-weight:700; cursor:pointer; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .mint { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .mint select, .mint input { padding:6px 8px; border:1.5px solid var(--line); border-radius:8px; font-size:13px; }
  .mint button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:7px 14px; font-weight:700; cursor:pointer; }
  #codeOut { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; word-break:break-all; }
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none">
  <h1>后台</h1>
  <p class="sub">输入访问口令</p>
  <input id="keyInput" type="password" placeholder="MEMEME_ADMIN_KEY" autocomplete="off">
  <button id="enterBtn">进入</button>
  <p id="gateErr" class="err-detail" style="display:none">口令不对</p>
</div>

<div id="dash" style="display:none">
  <h1>表情星球 · 后台</h1>
  <p class="sub" id="updated"></p>
  <div class="cards" id="cards"></div>

  <section>
    <h2>转化漏斗</h2>
    <div id="funnel"></div>
  </section>

  <section>
    <h2>变现 · 兑换码</h2>
    <div class="cards" id="moneyCards"></div>
    <div class="mint">
      <select id="codePlan">
        <option value="unlocked">¥9.9 全套放开</option>
        <option value="custom">¥29.9 专属定制（含全套全部权益）</option>
      </select>
      <input id="codeN" type="number" value="1" min="1" max="50" style="width:64px" title="生成几个码">
      <input id="codeUses" type="number" value="1" min="1" max="10000" style="width:80px" title="每码名额：1=卖的单次码，>1=活动码">
      <input id="codeDays" type="number" value="0" min="0" style="width:72px" title="有效天数：0=永久">
      <button id="codeBtn">生成兑换码</button>
      <span class="muted">名额=1 是卖的码；名额&gt;1 是限免活动码（发 /?code=XX 链接）</span>
    </div>
    <p id="codeOut"></p>
  </section>

  <section>
    <h2>上游用量 · 成本（usage 埋点上线后起算）</h2>
    <div class="cards" id="usageCards"></div>
  </section>

  <section>
    <h2>B 端定制线索</h2>
    <table><thead><tr><th>联系方式</th><th>需求</th><th>时间</th></tr></thead><tbody id="leads"></tbody></table>
  </section>

  <section>
    <h2>最近任务（全量 · 点图看大图，排查生成质量）</h2>
    <table><thead><tr><th>图</th><th>剧本</th><th>状态</th><th>完成</th><th>时间</th><th>错误</th></tr></thead><tbody id="jobs"></tbody></table>
  </section>

  <section>
    <h2>前端报错（抓机型 bug 用）</h2>
    <table><thead><tr><th>时间</th><th>detail</th></tr></thead><tbody id="errors"></tbody></table>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (ts) => ts ? new Date(ts * 1000).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '';
const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

function getKey() {
  return new URLSearchParams(location.search).get('key') || sessionStorage.getItem('admin_key') || '';
}

async function load() {
  const key = getKey();
  if (!key) { $('gate').style.display = 'block'; return; }
  const resp = await fetch('/api/admin/data?key=' + encodeURIComponent(key));
  if (resp.status === 403) { sessionStorage.removeItem('admin_key'); $('gate').style.display = 'block'; $('gateErr').style.display = 'block'; return; }
  if (!resp.ok) { document.body.innerHTML = '<p>加载失败</p>'; return; }
  sessionStorage.setItem('admin_key', key);
  if (location.search) history.replaceState(null, '', '/admin');  // 别把 key 留在地址栏
  render(await resp.json());
}

function render(d) {
  $('gate').style.display = 'none';
  $('dash').style.display = 'block';
  $('updated').textContent = '更新于 ' + new Date().toLocaleString('zh-CN');

  const shown = d.funnel.unlock_shown || 0;
  const pay = (d.funnel.pay_click || 0) + (d.funnel.pay_click_99 || 0) + (d.funnel.pay_click_299 || 0);
  const invite = d.funnel.invite_copy || 0, redeemed = d.funnel.redeem_ok || 0;
  const rate = shown ? Math.round(pay / shown * 100) : 0;
  $('cards').innerHTML = `
    <div class="stat"><b>${d.jobs.total}</b><span>总任务</span></div>
    <div class="stat"><b class="accent">${d.jobs.by_status.done || 0}</b><span>完成</span></div>
    <div class="stat"><b>${d.jobs.by_status.error || 0}</b><span>失败</span></div>
    <div class="stat"><b>${d.leads.length}</b><span>B端线索</span></div>
    <div class="stat"><b class="accent">${rate}%</b><span>付费墙→付款 (${pay}/${shown})</span></div>
    <div class="stat"><b>${invite}</b><span>邀请链接复制</span></div>
    <div class="stat"><b class="accent">${redeemed}</b><span>兑换成功</span></div>`;

  const m = d.monetize || { codes: {}, event: { uses: 0 }, devices: { total: 0, paid: 0 } };
  const cu = m.codes.unlocked || { total: 0, used: 0 };
  const cc = m.codes.custom || { total: 0, used: 0 };
  const revenue = (cu.used * 9.9 + cc.used * 29.9).toFixed(1);
  $('moneyCards').innerHTML = `
    <div class="stat"><b class="accent">¥${revenue}</b><span>累计收入（按已用码）</span></div>
    <div class="stat"><b>${m.devices.total}</b><span>设备数</span></div>
    <div class="stat"><b class="accent">${m.devices.paid}</b><span>已付费设备</span></div>
    <div class="stat"><b>${cu.used}/${cu.total}</b><span>9.9 码 已用/已发</span></div>
    <div class="stat"><b>${cc.used}/${cc.total}</b><span>29.9 码 已用/已发</span></div>
    <div class="stat"><b>${(m.event || {}).uses || 0}</b><span>活动码核销数</span></div>`;

  const u = d.usage || { total: { image: {}, videos: 0, video_tokens: 0, cost: 0 },
                         today: { image: {}, videos: 0, video_tokens: 0, cost: 0 } };
  $('usageCards').innerHTML = `
    <div class="stat"><b class="accent">¥${u.today.cost.toFixed(2)}</b><span>今日预估成本</span></div>
    <div class="stat"><b>¥${u.total.cost.toFixed(2)}</b><span>累计预估成本</span></div>
    <div class="stat"><b>${u.today.image.gemini || 0} / ${u.total.image.gemini || 0}</b><span>中转出图 今日/累计（包月≈0）</span></div>
    <div class="stat"><b class="accent">${u.today.image.seedream || 0} / ${u.total.image.seedream || 0}</b><span>即梦出图 今日/累计（¥0.2/张）</span></div>
    <div class="stat"><b>${u.today.videos} / ${u.total.videos}</b><span>视频 今日/累计</span></div>
    <div class="stat"><b>${(u.total.video_tokens / 1000).toFixed(1)}k</b><span>视频 tokens 累计（¥0.015/千）</span></div>`;

  const packs = Object.entries(d.jobs.by_pack).sort((a, b) => b[1] - a[1]);
  const max = packs.length ? packs[0][1] : 1;
  $('funnel').innerHTML = packs.map(([n, c]) =>
    `<div style="margin-bottom:6px">${esc(n)} · ${c}<div class="bar"><i style="width:${c / max * 100}%"></i></div></div>`).join('') || '<span class="muted">暂无</span>';

  $('leads').innerHTML = d.leads.map(l =>
    `<tr><td>${esc(l.contact)}</td><td>${esc(l.need)}</td><td>${fmt(l.ts)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">还没有线索</td></tr>';

  $('jobs').innerHTML = d.jobs.recent.map(j => {
    const pic = j.thumb
      ? `<a href="${esc(j.thumb)}" target="_blank" rel="noopener"><img src="${esc(j.thumb)}" loading="lazy" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1.5px solid var(--line)"></a>`
      : '';
    return `<tr><td>${pic}</td><td>${esc(j.pack_name)}</td><td><span class="pill ${j.status}">${esc(j.status)}</span></td><td>${j.done}/${j.total}</td><td>${fmt(j.created_at)}</td><td class="err-detail">${esc(j.error || '')}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="muted">暂无</td></tr>';

  $('errors').innerHTML = d.errors.map(e =>
    `<tr><td>${fmt(e.ts)}</td><td class="err-detail">${esc(e.detail)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">没有报错，很好</td></tr>';
}

$('codeBtn').onclick = async () => {
  const fd = new FormData();
  fd.append('plan', $('codePlan').value);
  fd.append('n', $('codeN').value);
  fd.append('uses', $('codeUses').value);
  fd.append('days', $('codeDays').value);
  const key = encodeURIComponent(sessionStorage.getItem('admin_key') || '');
  const resp = await fetch('/api/admin/codes?key=' + key, { method: 'POST', body: fd });
  if (!resp.ok) { $('codeOut').textContent = '生成失败：' + resp.status; return; }
  const d = await resp.json();
  $('codeOut').textContent = d.codes.join('   ');
  try { await navigator.clipboard.writeText(d.codes.join('\n')); $('codeOut').textContent += '（已复制）'; } catch (_) {}
  load();
};

$('enterBtn').onclick = () => { sessionStorage.setItem('admin_key', $('keyInput').value.trim()); load(); };
$('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('enterBtn').click(); });
load();
</script>
</body>
</html>
