# 游戏党 — 打游戏人的梗剧本（圈层化内容策略：开黑群天天用得上）
# 顺序即叙事：从上号到菜就多练。前 8 个是免费层（最高 sendability 优先）。

id: youxidang
name: 游戏党
description: 打游戏人的 16 个名场面，从「上号！」到「菜就多练」
version: 1
language: zh
style_id: anime

style: |
  Q版三头身（chibi）贴纸插画风格，粗白色描边，背景必须纯白。
  人物特征必须与参考照片一致并贯穿全套：发型、脸型、肤色、眼镜/配饰等标志性特征。
  人物戴游戏耳机，道具是发光的机械键盘、鼠标、手柄、能量饮料罐，
  胜负的情绪特效（火花、闪电、乌云）点缀。表情夸张、动作戏剧化，微信表情包审美。
  文案以大号中文字体渲染在画面下方居中，字色深、带白边，清晰可读。

memes:
